<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px; overflow: hidden; position: relative;
        background: linear-gradient(150deg, #223258 0%, #1b2b4b 52%, #0d1526 100%);
        color: #fff; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        display: flex; align-items: center; padding: 0 48px; gap: 34px;
      }
      .glow {
        position: absolute; width: 620px; height: 620px; border-radius: 50%;
        background: radial-gradient(circle, rgba(59,107,245,.4), transparent 62%);
        left: -220px; top: -260px;
      }
      .glow2 {
        position: absolute; width: 520px; height: 520px; border-radius: 50%;
        background: radial-gradient(circle, rgba(242,163,60,.28), transparent 66%);
        right: -160px; bottom: -240px;
      }
      .left { position: relative; width: 340px; flex: none; }
      .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 26px; }
      .mark {
        width: 38px; height: 38px; border-radius: 12px;
        background: linear-gradient(145deg, #3b6bf5, #7b61ff);
        display: grid; place-items: center; font-weight: 800; font-size: 18px;
      }
      .brand b { font-size: 19px; letter-spacing: -.01em; }
      .brand span { display: block; font-size: 10px; color: rgba(255,255,255,.5); letter-spacing: .1em; margin-top: 1px; }
      h1 { font-size: 36px; line-height: 1.2; letter-spacing: -.03em; font-weight: 800; }
      h1 em {
        font-style: normal;
        background: linear-gradient(100deg, #ffb020, #ff7a45);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      p { margin-top: 14px; font-size: 13px; line-height: 1.8; color: rgba(255,255,255,.62); }
      .badge {
        margin-top: 22px; display: inline-flex; align-items: center; gap: 7px;
        padding: 7px 13px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
        background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16);
      }
      .cards { position: relative; display: flex; gap: 16px; flex: 1; justify-content: flex-end; }
      .card {
        width: 198px; background: #fff; border-radius: 18px; padding: 14px 14px 16px;
        box-shadow: 0 26px 50px -30px rgba(0,0,0,.9); text-align: center; color: #1b2b4b;
      }
      .card img { width: 100%; display: block; border-radius: 8px; }
      .card b { display: block; font-size: 13px; margin-top: 10px; }
      .card span { display: block; font-size: 10px; color: #7c8798; margin-top: 2px; line-height: 1.5; }
      .foot {
        position: absolute; left: 64px; bottom: 30px; font-size: 11px;
        color: rgba(255,255,255,.34); letter-spacing: .06em;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="glow2"></div>

    <div class="left">
      <div class="brand">
        <div class="mark">F</div>
        <div>
          <b>FastStudy</b>
          <span>期末极限备考</span>
        </div>
      </div>
      <h1>扫码就用，<br /><em>三秒进状态。</em></h1>
      <p>网页版直接打开、安卓包直接装。<br />不用注册，进度存在你自己手机上。</p>
      <div class="badge">🍀 平时欠的知识，期末一起还</div>
    </div>

    <div class="cards">
      <div class="card">
        <img src="qr/demo.png" alt="网页 Demo" />
        <b>网页版 Demo</b>
        <span>桌面 / 手机浏览器<br />带演示数据</span>
      </div>
      <div class="card">
        <img src="qr/apk.png" alt="安卓安装包" />
        <b>安卓 APK</b>
        <span>Android 7.0+<br />9.5 MB · 离线可用</span>
      </div>
      <div class="card">
        <img src="qr/repo.png" alt="源码仓库" />
        <b>源码仓库</b>
        <span>GitHub · MIT<br />能改能自己跑</span>
      </div>
    </div>

    <div class="foot">农客松 AgriHackathon 2026 · 主赛道「人类与学习」</div>
  </body>
</html>
