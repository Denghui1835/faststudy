<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1024px; height: 1024px; overflow: hidden; position: relative;
        background: linear-gradient(150deg, #3b6bf5 0%, #4a55e8 42%, #7b61ff 100%);
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center;
      }
      .sun {
        position: absolute; width: 520px; height: 520px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,.35), transparent 62%);
        left: -160px; top: -180px;
      }
      .ring {
        position: absolute; width: 620px; height: 620px; border-radius: 50%;
        border: 3px solid rgba(255,255,255,.14);
      }
      .letter {
        position: relative;
        font-size: 430px; font-weight: 800; color: #fff; line-height: 1;
        letter-spacing: -16px; transform: translateY(-10px);
        text-shadow: 0 22px 50px rgba(10, 16, 32, .35);
      }
      .dot {
        position: absolute; width: 84px; height: 84px; border-radius: 50%;
        background: #f2a33c; right: 300px; top: 268px;
        box-shadow: 0 14px 34px rgba(242,163,60,.55);
      }
    </style>
  </head>
  <body>
    <div class="sun"></div>
    <div class="ring"></div>
    <div class="letter">F</div>
    <div class="dot"></div>
  </body>
</html>
