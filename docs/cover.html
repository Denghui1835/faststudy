<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px; overflow: hidden;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background: radial-gradient(120% 120% at 12% 0%, #22305c 0%, #131d33 45%, #0c1220 100%);
        color: #fff; position: relative;
      }
      .glow { position: absolute; width: 620px; height: 620px; border-radius: 50%; right: -180px; top: -260px;
        background: radial-gradient(circle, rgba(255,90,54,.55), transparent 62%); }
      .glow2 { position: absolute; width: 520px; height: 520px; border-radius: 50%; left: -160px; bottom: -300px;
        background: radial-gradient(circle, rgba(91,108,255,.4), transparent 65%); }
      .wrap { position: relative; padding: 62px 0 0 72px; display: flex; gap: 40px; }
      .left { width: 660px; }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
      .mark { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center;
        font-weight: 900; font-size: 22px; background: linear-gradient(140deg,#ff5a36,#ffb020);
        box-shadow: 0 10px 26px -12px rgba(255,90,54,.9); }
      .brand b { font-size: 22px; letter-spacing: -.01em; }
      .brand span { font-size: 12px; color: rgba(255,255,255,.55); letter-spacing: .16em; display: block; margin-top: 2px; }
      h1 { font-size: 66px; line-height: 1.08; letter-spacing: -.035em; font-weight: 800; }
      h1 em { font-style: normal; background: linear-gradient(100deg,#ff7a45,#ffb020); -webkit-background-clip: text; color: transparent; }
      .sub { margin-top: 20px; font-size: 25px; color: rgba(255,255,255,.74); letter-spacing: .01em; }
      .chips { margin-top: 36px; display: flex; gap: 12px; flex-wrap: wrap; }
      .chip { padding: 10px 18px; border-radius: 999px; font-size: 15px; font-weight: 600;
        background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.14); }
      .chip.hot { background: rgba(255,90,54,.2); border-color: rgba(255,90,54,.5); color: #ffb4a0; }
      .foot { position: absolute; left: 72px; bottom: 46px; font-size: 14px; color: rgba(255,255,255,.42); letter-spacing: .04em; }
      .phone { position: absolute; right: 64px; top: 54px; width: 300px; height: 560px; border-radius: 34px;
        border: 8px solid #0a1020; box-shadow: 0 40px 80px -30px rgba(0,0,0,.85); overflow: hidden; background: #f4f2ec; }
      .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="wrap">
      <div class="left">
        <div class="brand">
          <div class="mark">F</div>
          <div>
            <b>FastStudy</b>
            <span>期末极限备考</span>
          </div>
        </div>
        <h1>平时欠的知识，<br /><em>期末一起还。</em></h1>
        <div class="sub">按「还剩几天考试」切换策略的 AI 备考小程序</div>
        <div class="chips">
          <div class="chip hot">≤3 天 保命模式</div>
          <div class="chip">4–13 天 定点爆破</div>
          <div class="chip">≥14 天 系统重建</div>
        </div>
      </div>
    </div>
    <div class="phone"><img src="shots/m-home.png" alt="" /></div>
    <div class="foot">农客松 AgriHackathon 2026 · 主赛道「人类与学习」</div>
  </body>
</html>
